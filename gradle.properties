org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true

# AGP 9 refuses `com.android.application` in the same module as the Kotlin
# Multiplatform plugin. These two flags are the documented bypass and keep the
# single-module `composeApp` layout. See CLAUDE.md > "AGP 9 constraint" for the
# migration trigger.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
